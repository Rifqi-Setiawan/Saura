version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: saura
      POSTGRES_PASSWORD: saura
      POSTGRES_DB: saura
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg://saura:saura@db:5432/saura
      - SIMULATION_MODE=true
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - photo_data:/data/photos

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  photo_data:
